spring.application.name=backend
# Railway (and most cloud hosts) assign the port via $PORT - falls back to 8082 locally.
server.port=${PORT:8082}

# --- Database ---
# Locally: Postgres running in Docker (see docker-compose.yml, port 5433).
# On Railway: PGHOST/PGPORT/PGUSER/PGPASSWORD/PGDATABASE are auto-provided by the
# linked Postgres service, so no manual config is needed there beyond linking it.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5433}/${PGDATABASE:grocerylist}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${PGUSER:grocerylist}
spring.datasource.password=${PGPASSWORD:DevPassword123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- JWT ---
# Locally this dev-only default is fine. In production, JWT_SECRET must be set to a
# real random secret via the host's environment variables - never commit a real one.
jwt.secret=${JWT_SECRET:CHANGE_ME_dev_only_secret_replace_before_any_deploy_1234567890}
# 30 days - mobile apps are expected to keep you signed in until you explicitly log out.
# A single long-lived token is a reasonable MVP simplification; a production app would
# use a short-lived access token plus a separate refresh token instead.
jwt.expiration-ms=2592000000
